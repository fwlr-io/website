[package]
name = "fwlr-io"
version = "0.1.0"
edition = "2024"
resolver = "3"

[dependencies]
console_error_panic_hook = "0.1.7"
convert_case = "0.11.0"
leptos = { version = "0.8.19", features = ["nightly", "csr"] }
leptos-use = "0.18.3"
leptos_router = { version = "0.8.13", features = ["nightly"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = "0.3.23"
tracing-subscriber-wasm = "0.1.0"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1

[package.metadata.leptos]
assets-dir = "public"
